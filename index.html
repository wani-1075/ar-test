<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    html, body{
      margin:0;
      width:100%;
      height:100%;
      overflow:hidden;
    }

    model-viewer{
      width:100%;
      height:100%;
      background:#ffffff;
    }
  </style>
</head>

<body>

<model-viewer
  src="./test_rabbit3.glb"

  ar
  ar-modes="scene-viewer webxr"

  camera-controls
  auto-rotate

  shadow-intensity="1"
  exposure="1"

  loading="eager"

  alt="Rabbit">

</model-viewer>

</body>
</html>
